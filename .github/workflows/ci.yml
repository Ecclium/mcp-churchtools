# Checks for every pull request, every push to main and the merge queue.
#
# Each job's name equals its id and is a required status check in the ruleset
# for main, except lockfile-provenance, which must never become one (see
# that job). Renaming a required job breaks the ruleset. The workflow has no
# path filter, because a workflow that does not run leaves a required check
# pending forever; jobs that only make sense for some events are skipped with
# `if:`, and a skipped job counts as passed.
#
# Supply chain (ADR 0021): the workflow starts without permissions and every
# job gets `contents: read` only. Checkout does not keep the token, every
# action is pinned to a full commit SHA with its exact version as a comment,
# and no job uses secrets or a cache. A poisoned cache could replace gitleaks
# or zizmor, and the checksums in mise.lock are not checked again when tools
# are restored from a cache. Workflows from forks run only after a maintainer
# has approved them; CONTRIBUTING.md lists what to review first.
#
# mise installs the tools pinned in mise.toml with the checksums from
# mise.lock (locked mode). The mise binary itself is verified by mise-action
# against the signed checksums of its release. The version of mise is pinned
# here and in .github/renovate.json5, and tests/toolchain.test.mts keeps both
# in step: a newer mise may write a lock file format that this one rejects.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request makes the older run useless. Runs on main
  # and in the merge queue are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # An explicit bash adds -o pipefail, so a failure inside a pipe fails the
    # step instead of being hidden by the last command of the pipe.
    shell: bash

env:
  MISE_LOCKED: 1

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint, shellcheck and zizmor
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.0
          cache: false
          install_args: aqua:rhysd/actionlint aqua:koalaman/shellcheck aqua:zizmorcore/zizmor
      - name: Lint the workflows
        # actionlint also runs shellcheck over every run step.
        run: actionlint
      - name: Audit the workflows
        # Online, zizmor also checks that each pinned SHA belongs to the
        # action and matches the version in its comment, and that no pinned
        # version has a known vulnerability of medium severity or above. The
        # job token only reads.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=medium --no-progress .github/workflows

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # No pnpm install and no code from the repository run in this job, so a
    # change to the scripts or dependencies cannot switch the scan off.
    steps:
      - name: Check out with the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.0
          cache: false
          install_args: aqua:gitleaks/gitleaks
      - name: Refuse ignore files of gitleaks
        # gitleaks reads a .gitleaksignore in the checkout on its own, and one
        # line there silences any finding. Findings are allowed only through
        # the reviewed allowlists in .gitleaks.toml (ADR 0014).
        run: |
          if [ -n "$(find . -name .gitleaksignore -not -path './.git/*' -print -quit)" ]; then
            echo 'Eine Datei .gitleaksignore schaltet Funde ab und ist nicht erlaubt. Erweitern Sie stattdessen die Allowlist in .gitleaks.toml.' >&2
            exit 1
          fi
      - name: Scan every commit that leads to the tested one
        # --redact: the log of a public repository is public, so a finding
        # must not print the value it found. --ignore-gitleaks-allow: an
        # inline comment cannot silence a finding (ADR 0014). The history of
        # the tested commit only, not every branch of the repository.
        run: gitleaks git --redact --no-banner --ignore-gitleaks-allow --log-opts=HEAD -c .gitleaks.toml .
      - name: Scan the checked-out files
        # Catches content that the scan of the history does not see, such as
        # changes made while resolving a merge conflict.
        run: gitleaks dir --redact --no-banner --ignore-gitleaks-allow -c .gitleaks.toml .
      - name: Scan the names of all files, now and in the history
        # Both scans above read contents, not names, and a file name can
        # carry a host or an address just as well. quotePath=false keeps
        # names with umlauts readable for the rules. LC_ALL=C sorts bytewise,
        # so a name with an invalid byte cannot make sort fail and empty the
        # input of the scan. The two lines printed first keep gitleaks from
        # skipping the names as a binary file when the first name starts like
        # one, such as %PDF, and sed G puts an empty line after each name
        # (see .gitleaks.toml).
        run: |
          { printf '\n%40000s\n' ''
            { git -c core.quotePath=false log --format= --name-only HEAD
              git -c core.quotePath=false ls-files
            } | LC_ALL=C sort -u | sed G
          } | gitleaks stdin --redact --no-banner --ignore-gitleaks-allow -c .gitleaks.toml
      - name: Scan the messages of every commit that leads to the tested one
        # The scan of the history reads what each commit changes, not its
        # message. A message reaches main in the squash commit, and whoever
        # merges can change it in the dialog of the merge, after pr-meta has
        # checked the messages of the pull request. On a push to main this
        # step reads the message as it arrived and every older one, so it
        # does not depend on which commits the event names. It finds data
        # only once it is on main, where a finding is handled as ADR 0014
        # describes. The two lines printed first: see the step before.
        run: |
          { printf '\n%40000s\n' ''
            git log --format=%B HEAD
          } | gitleaks stdin --redact --no-banner --ignore-gitleaks-allow -c .gitleaks.toml
      - name: Refuse binary files outside brand/
        # gitleaks skips binary files before any rule runs, so an office
        # export, a database or an archive with member data passes every scan
        # above. Git tells binary from text by content and shows a binary
        # file as "-" in --numstat, in every commit and in the tested tree.
        # The attributes come from the empty tree, so a .gitattributes in the
        # pull request cannot make a binary file count as text, and -m shows
        # what a merge commit adds. Git counts a file as binary only if its
        # first 8000 bytes hold a NUL byte, so the usual export formats are
        # also refused by name, whatever their case. Only brand/, which is
        # delivered as a whole, holds such files (ADR 0014).
        run: |
          empty=$(git hash-object -t tree /dev/null)
          { git -c core.quotePath=false --attr-source="$empty" log -m --numstat --no-renames --format= HEAD
            git -c core.quotePath=false --attr-source="$empty" diff --numstat --no-renames "$empty" HEAD
          } | awk -F '\t' '($1 == "-" || tolower($3) ~ /\.(pdf|docx?|xls[xm]?|od[ts]|sqlite3?|db|zip|7z|rar|tar|tgz|gz)$/) && $3 !~ /^brand\// && !seen[$3]++ { print "Binär- oder Exportdatei ausserhalb von brand/: " $3 > "/dev/stderr"; bad = 1 } END { exit bad }'

  # check, compat and minimum run the same steps on different versions of
  # Node.js (ADR 0019): the development version from mise.toml, the next line
  # from mise.compat.toml and the oldest supported version from
  # mise.minimum.toml.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and the tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.0
          cache: false
      - name: Install the dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check that the install changed no tracked file
        # pnpm can write to pnpm-workspace.yaml during an install. A change
        # to a protection setting must fail here, not pass unseen.
        run: git diff --exit-code
      - name: Build, then run every check
        run: pnpm run ci:check
      - name: Check that the checks changed no tracked file
        run: git diff --exit-code

  compat:
    name: compat
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENV: compat
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and the tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.0
          cache: false
      - name: Install the dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check that the install changed no tracked file
        run: git diff --exit-code
      - name: Build, then run every check
        run: pnpm run ci:check
      - name: Check that the checks changed no tracked file
        run: git diff --exit-code

  minimum:
    name: minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_ENV: minimum
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and the tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.0
          cache: false
      - name: Install the dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check that the install changed no tracked file
        run: git diff --exit-code
      - name: Build, then run every check
        run: pnpm run ci:check
      - name: Check that the checks changed no tracked file
        run: git diff --exit-code

  deps-review:
    name: deps-review
    # Compares the dependencies of the base and the head of a pull request.
    # Other events have no such pair; a skipped job counts as passed.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review new and changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Any known vulnerability fails, in runtime and development
          # dependencies alike: development tools run in CI and on
          # developer machines. Licences are checked by our own script
          # against its allowlist (ADR 0021). No comment on the pull
          # request, which would need write access, and no calls to
          # services outside GitHub.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false

  # Not a required check, and it must not become one: the ruleset has no
  # bypass, so a required check that fails would also stop a person from
  # merging. It fails when a pull request adds versions to pnpm-lock.yaml
  # that come without a provenance attestation through a trusted publisher.
  # Renovate merges only when every check has passed (platformAutomerge is
  # false in .github/renovate.json5), so such an update waits for a person,
  # who can merge after looking at the named packages (ADR 0021). It runs in
  # this workflow, so its check exists on the commit as early as the others.
  lockfile-provenance:
    name: lockfile-provenance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out with the whole history
        # For a pull request this is the test merge: HEAD^1 is the base.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.0
          cache: false
          install_args: node
      - name: Check the provenance of new lockfile entries
        run: node scripts/ci/check-lockfile-provenance.mts HEAD^1
