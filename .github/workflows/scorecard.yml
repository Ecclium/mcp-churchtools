# OpenSSF Scorecard rates the security practices of this repository and
# publishes the result, which the public Scorecard API and its badge show.
#
# The Scorecard service accepts results only from a workflow that keeps its
# rules: no env and no defaults at the top, a hosted Ubuntu runner, only
# actions from its own list and no run steps in this job, and no other job
# with id-token: write. Results are published from the default branch only.
#
# This is the only job in the workflows of this repository with write
# permissions: it uploads the results as code scanning alerts
# (security-events) and signs them for the Scorecard service (id-token).
# CodeQL runs in a job of its own that GitHub manages. The organisation
# allows scorecard-action, upload-artifact and upload-sarif only with their
# exact SHA, so an update of one of them needs a new entry there first
# (ADR 0021).
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 04:17 UTC, off the full hour when many schedules start.
    - cron: '17 4 * * 1'
  branch_protection_rule:

permissions: {}

jobs:
  scorecard:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      security-events: write # upload the results to code scanning
      id-token: write # prove to the Scorecard service where results come from
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the results for five days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
          if-no-files-found: error
      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
