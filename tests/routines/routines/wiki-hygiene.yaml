# Routine für Tests: monatlicher Bericht über die Pflege des Wikis, ohne
# Modell, mit den festen Prüfungen des Kerns. Erfunden, wie alle Testdaten.
schema: routine.v1
id: wiki-hygiene
schedule: '0 7 1 * *'
checks:
  - check: stalePages
    olderThanDays: 365
    maxItems: 50
  - check: brokenLinks
    maxItems: 50
template: templates/wiki-hygiene.md
output:
  target: wiki
  tool: ct_wiki_page_append_section
  scope: { category: Berichte, page: Wiki-Pflege }
  idempotencyKey: 'wiki-hygiene:{month}'
