# Routine für Tests: Entwurf einer Übersicht der Termine für den
# Gemeindebrief, als Datei. Erfunden, wie alle Testdaten.
schema: routine.v1
id: termin-vorschau
schedule: '0 6 * * MON'
inputs:
  - name: termine
    tool: ct_appointments_list
    params: { from: '+7d', to: '+35d' }
    maxItems: 80
generate:
  prompt: prompts/termin-vorschau.md
  model: default
  output:
    blocks:
      termine:
        maxItems: 40
        fields:
          datum: { type: date }
          titel: { type: text, maxLength: 120 }
          text: { type: text, maxLength: 300 }
template: templates/termin-vorschau.md
output:
  target: draft
  channel: file
  idempotencyKey: 'termin-vorschau:{isoWeek}'
notify:
  - channel: file
