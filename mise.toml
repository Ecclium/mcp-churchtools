# Pinned tool versions for local work and CI.
#
# Install in locked mode (MISE_LOCKED=1). mise.lock records download URLs and
# checksums per platform and is the integrity anchor, because several upstream
# releases (pnpm, zizmor, shellcheck) publish no checksum file of their own.
# Backends are named explicitly so that a change in the mise registry cannot
# move a tool to another source without a visible diff here.
[tools]
node = "24.21.0"
"aqua:pnpm/pnpm" = "11.27.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:evilmartians/lefthook" = "2.1.14"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
