# Vorlage für Squid als Grenze im Netz des Runners von Ecclium (ADR 0035).
# Image: ubuntu/squid:7.2-26.04_edge@sha256:385450caa9d4d97cb6f98736964884918445241e1489a8eefbbc7c48086db2e3
#
# Alle Regeln «http_access» stehen in dieser Datei. Die Liste der Ziele
# erzeugt «ecclium init egress» nur als Kommentare und Zeilen «acl»; sie
# gehört in die Datei /etc/squid/ecclium-targets.conf, die ganz unten
# eingebunden wird. Ändern
# Sie diese Vorlage nicht, um ein Ziel zuzulassen: Setzen Sie die
# Konfiguration von Ecclium und erzeugen Sie die Liste neu.

http_port 3128
visible_hostname ecclium-egress
httpd_suppress_version_string on
pid_filename none
shutdown_lifetime 3 seconds
icp_port 0
htcp_port 0
client_db off
pinger_enable off

# Kein Cache und kein Aufbrechen von TLS: Squid baut nur Tunnel.
cache deny all
cache_mem 0 MB

# Zugriffslog nur mit Host und Port des Ziels, ohne Pfad und Query.
logformat ecclium %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %>rd %>rP %<a
access_log stdio:/dev/stdout ecclium
cache_log stdio:/dev/stderr
strip_query_terms on
logfile_rotate 0

acl ecclium_connect method CONNECT
acl ecclium_tls_port port 443

# Die Listen der Ziele. Die erste Zeile jeder Liste passt nie, weil kein
# Ziel zwei Ports hat. So gibt es beide Namen auch mit einer leeren Liste,
# und die erzeugte Datei kann nur Paare aus Name und Port anhängen. Erst
# ihre letzte Zeile macht «ecclium_complete» wahr: Eine Liste, die mitten
# in einem Paar abbricht, etwa bei voller Platte, lässt nichts durch.
acl ecclium_none_one port 1
acl ecclium_none_two port 2
acl ecclium_public all-of ecclium_none_one ecclium_none_two
acl ecclium_lan all-of ecclium_none_one ecclium_none_two
acl ecclium_complete all-of ecclium_none_one ecclium_none_two

# Nie ein Ziel, auch nicht im lokalen Netz: unspezifiziert, Loopback,
# Link-Local, Multicast und reserviert.
acl ecclium_never dst 0.0.0.0/8 127.0.0.0/8 169.254.0.0/16 224.0.0.0/4 240.0.0.0/4
acl ecclium_never dst ::/128 ::1/128 fe80::/10 ff00::/8

# Private und besondere Bereiche, gesperrt für Ziele ausserhalb des lokalen
# Netzes. Für IPv4 RFC 1918, CGNAT, Protokolle der IETF, Dokumentation,
# 6to4-Relais und Benchmarks; für IPv6 NAT64, IPv4-kompatibel, Discard,
# Protokolle der IETF mit Teredo, Dokumentation, 6to4, SRv6, ULA und
# Site-Local. IPv4 in IPv6 (::ffff:0:0/96) fehlt mit Absicht: Squid liest
# den Bereich als 0.0.0.0/0 und sperrte jedes Ziel. Er prüft solche
# Adressen als IPv4, die Bereiche für IPv4 gelten also auch für sie.
acl ecclium_special dst 10.0.0.0/8 100.64.0.0/10 172.16.0.0/12 192.0.0.0/24
acl ecclium_special dst 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15
acl ecclium_special dst 198.51.100.0/24 203.0.113.0/24
acl ecclium_special dst 64:ff9b::/96 64:ff9b:1::/48 ::/96 100::/64 2001::/23
acl ecclium_special dst 2001:db8::/32 3fff::/20 2002::/16 5f00::/16 fc00::/7 fec0::/10

# Die Reihenfolge zählt. Für einen Namen, der auf keiner der beiden Listen
# steht, prüft Squid bis zur vierten Regel nur Methode, Vollständigkeit der
# Liste, Name und Port und fragt nie DNS. So kann auch DNS keine Daten nach
# draussen tragen.
http_access deny !ecclium_connect
http_access deny !ecclium_complete
http_access allow ecclium_lan !ecclium_never
http_access deny !ecclium_public
http_access deny !ecclium_tls_port
http_access deny ecclium_never
http_access deny ecclium_special
http_access allow ecclium_public
http_access deny all

# Die erzeugte Liste der Ziele. Sie steht nach der letzten Regel: Eine
# Zeile «http_access» darin käme nie zum Zug.
include /etc/squid/ecclium-targets.conf
